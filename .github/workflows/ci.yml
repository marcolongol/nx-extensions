# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs of the same PR; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PRs only get a read-only token (if NX_CLOUD_READ_TOKEN exists), so they
  # can't write to the shared remote cache
  NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'pull_request' && secrets.NX_CLOUD_READ_TOKEN || secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_SKIP_NX_CACHE: ${{ vars.NX_SKIP_NX_CACHE || 'false' }}

permissions:
  actions: read
  contents: read

jobs:
  # The job id is the required status check on main; keep it in sync with
  # the branch ruleset when renaming
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: azure/setup-helm@v5.0.1
        with:
          version: '4.3.1'

      # Dependency install scripts are denied in pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec nx format:check
      - run: pnpm exec nx affected -t lint test build e2e --parallel 3
