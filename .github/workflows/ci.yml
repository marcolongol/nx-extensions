# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs of the same PR; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_SKIP_NX_CACHE: ${{ vars.NX_SKIP_NX_CACHE || 'false' }}

permissions:
  actions: read
  contents: read

jobs:
  # The job id is the required status check on main; keep it in sync with
  # the branch ruleset when renaming
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '4.3.1'

      # Dependency install scripts are denied in pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5

      - run: pnpm exec nx format:check
      - run: pnpm exec nx affected -t lint test build e2e --parallel 3
