# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
# Versions, tags and publishes the packages with nx release, from the
# conventional commits since the last release. Run it from main; it defaults
# to a dry run that only prints what would happen.
name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        description: Dry run (print versions, changelogs and the publish without changing anything)
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dry-run:
    if: inputs.dryRun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Publishing reads the built packages, so build them first
      - run: pnpm exec nx run-many -t build -p helm,core

      - run: pnpm exec nx release --dry-run --yes --verbose

  version:
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main; start the workflow from main or use a dry run"
          exit 1

      # The bot App's ID and key, as step outputs so later steps never see them
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: false
          # 1Password CLI has no Renovate datasource; bump manually
          version: '2.42.0'
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          BOT_APP_ID: op://homelab/GITHUB/GITHUB_APP_ID
          BOT_APP_PRIVATE_KEY: op://homelab/GITHUB/GITHUB_APP_PRIVATE_KEY

      # The bot may bypass the main ruleset to push the release commit and
      # tags; this token only gets contents: write
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ steps.op.outputs.BOT_APP_ID }}
          private-key: ${{ steps.op.outputs.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Commit as the release App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Version, changelog, commit, tag, push and GitHub releases
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pnpm exec nx release --skip-publish --yes --verbose
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Build after versioning, so the packages carry the new versions
      - run: pnpm exec nx run-many -t build -p helm,core

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusted publishing is configured for this environment; require a
    # reviewer on it
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      # Only needed so nx can run; dependency install scripts are denied in
      # pnpm-workspace.yaml, which matters while the OIDC token is available
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      # Versions already on npm are skipped, so only released packages go out
      - run: pnpm exec nx release publish --verbose
        env:
          NPM_CONFIG_PROVENANCE: 'true'
